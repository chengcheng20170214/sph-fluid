<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>SPH 粒子流体模拟</title>
<style>
*{margin:0;padding:0}
body{background:#111;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;font-family:monospace}
canvas{border-radius:8px;box-shadow:0 0 30px rgba(0,100,255,0.3)}
#info{position:fixed;top:10px;left:10px;color:#aaa;font-size:12px;line-height:1.6;pointer-events:none}
#info span{color:#fff}
#panel{position:fixed;top:10px;right:10px;background:rgba(10,14,26,0.75);border-radius:8px;padding:12px 16px;color:#ccc;font-size:12px;min-width:140px;user-select:none;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.08);z-index:10}
#panel .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;cursor:pointer}
#panel .header .title{color:#8af;font-weight:bold;font-size:13px}
#panel .header .toggle{color:#666;font-size:14px;line-height:1}
#panel .body{display:flex;flex-direction:column;gap:6px}
#panel .body.hidden{display:none}
#panel .row{display:flex;justify-content:space-between;align-items:center}
#panel .row label{color:#999}
#panel .row .val{color:#fff;font-weight:bold;min-width:24px;text-align:right}
#panel input[type=range]{width:100%;margin:4px 0;accent-color:#48f;background:transparent;cursor:pointer;height:4px}
#algo{position:fixed;bottom:0;left:0;right:0;background:rgba(6,8,18,0.88);border-top:1px solid rgba(80,120,200,0.25);padding:8px 14px;font-size:11px;color:#8ca;line-height:1.5;font-family:'Courier New',monospace;z-index:10;backdrop-filter:blur(8px);display:flex;gap:12px;overflow-x:auto}
#algo .step{flex:0 0 auto;min-width:170px;padding:6px 10px;border-radius:6px;border:1px solid rgba(80,120,200,0.15);background:rgba(20,30,60,0.5)}
#algo .step.active{border-color:rgba(80,180,255,0.6);background:rgba(20,40,80,0.7);box-shadow:0 0 12px rgba(80,160,255,0.15)}
#algo .step .stitle{color:#6bf;font-weight:bold;margin-bottom:3px;font-size:11px}
#algo .step .sline{color:#7a8a9a;white-space:nowrap}
#algo .step .sline b{color:#cde;font-weight:normal}
#algo .step .sline .warn{color:#fa4}
#algo .step .sline .good{color:#4f8}
#algo .step .sline .hot{color:#f84}
.color-row{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.color-row label{color:#999}
.color-row input[type=color]{width:26px;height:26px;border:2px solid rgba(255,255,255,0.2);border-radius:5px;cursor:pointer;padding:0;background:0;vertical-align:middle}
.color-row input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.color-row input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
</style>
</head>
<body>
<div id="info">
  <span>SPH 流体模拟</span><br>
   水滴(蓝) · 蜡液(橙)<br>
   鼠标按住拖动搅拌
</div>
<div id="panel">
  <div class="header" id="panelToggle">
    <span class="title">⚙ 控制</span>
    <span class="toggle" id="panelIcon">−</span>
  </div>
  <div class="body" id="panelBody">
    <div class="row">
      <label>粒子大小</label>
      <span class="val" id="sizeVal">4.0</span>
    </div>
    <input type="range" id="sizeSlider" min="1" max="10" step="0.5" value="4">
    <div class="color-row">
      <label>水</label>
      <input type="color" id="waterColor" value="#3c8cff">
    </div>
    <div class="color-row">
      <label>蜡</label>
      <input type="color" id="waxColor" value="#ffa028">
    </div>
  </div>
</div>
<div id="algo">
  <div class="step" id="s0"><div class="stitle">① 粒子初始化</div><div class="sline">—</div></div>
  <div class="step" id="s1"><div class="stitle">② 近邻搜索 (Grid)</div><div class="sline">—</div></div>
  <div class="step" id="s2"><div class="stitle">③ 密度·压力</div><div class="sline">—</div></div>
  <div class="step" id="s3"><div class="stitle">④ 压力·粘性力</div><div class="sline">—</div></div>
  <div class="step" id="s4"><div class="stitle">⑤ 加速度·积分</div><div class="sline">—</div></div>
  <div class="step" id="s5"><div class="stitle">⑥ 边界约束</div><div class="sline">—</div></div>
</div>
<canvas id="c"></canvas>
<script>
// ============ 配置 ============
const W = 900, H = 640;
const CX = W / 2, CY = H / 2; // 球体中心
const BR = 300; // 球体半径
const GRAVITY = 600;
const H_RADIUS = 22; // 平滑核半径
const DT = 0.003;
const SUBSTEPS = 3;
let PARTICLE_R = 4;
let RENDER_R = PARTICLE_R;
const DAMPING = 0.3;
const MOUSE_RADIUS = 80;
const MOUSE_FORCE = 25000;

// 流体属性
const WATER = 0, WAX = 1;
const FLUID_PROPS = [
  { name: 'water', restDensity: 1020, stiffness: 4000, viscosity: 80,  color: [60, 140, 255] },
  { name: 'wax',   restDensity: 580,  stiffness: 3000, viscosity: 500, color: [255, 160, 40]  },
];

// ============ Canvas ============
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

// ============ 粒子 ============
const particles = [];

// ============ 算法统计面板 ============
const stats = {
  activeStep: -1,       // 当前正在执行的步骤
  stepTimes: [0,0,0,0,0,0], // 各步骤耗时 ms
  // Step 0: 初始化
  init: { waterCount: 0, waxCount: 0, totalMass: 0 },
  // Step 1: 近邻搜索
  grid: { cellSize: 0, cells: 0, avgNeighbors: 0, maxNeighbors: 0, buildTime: 0 },
  // Step 2: 密度·压力
  density: { minDensity: 0, maxDensity: 0, avgDensity: 0, minPressure: 0, maxPressure: 0 },
  // Step 3: 力
  forces: { maxPressureForce: 0, maxViscForce: 0, maxGravityForce: 0, totalForce: 0 },
  // Step 4: 积分
  integrate: { maxAccel: 0, maxVel: 0, avgVel: 0 },
  // Step 5: 边界
  boundary: { collisions: 0, maxReflect: 0 },
  // 全局
  frameTime: 0, fps: 0,
};

function setActiveStep(n) {
  stats.activeStep = n;
}

function updateAlgoPanel() {
  // Step 0: 初始化
  const s0 = document.getElementById('s0');
  s0.className = 'step' + (stats.activeStep === 0 ? ' active' : '');
  s0.querySelector('.sline').innerHTML =
    `水: <b>${stats.init.waterCount}</b>  蜡: <b>${stats.init.waxCount}</b><br>` +
    `h=<b>${H_RADIUS}</b> dt=<b>${DT}</b> sub=<b>${SUBSTEPS}</b><br>` +
    `ρ₀水=<b>${FLUID_PROPS[0].restDensity}</b> ρ₀蜡=<b>${FLUID_PROPS[1].restDensity}</b>`;

  // Step 1: 近邻搜索
  const s1 = document.getElementById('s1');
  s1.className = 'step' + (stats.activeStep === 1 ? ' active' : '');
  const g = stats.grid;
  s1.querySelector('.sline').innerHTML =
    `Cell=<b>${g.cellSize}</b>  活跃格=<b>${g.cells}</b><br>` +
    `平均邻居=<b>${g.avgNeighbors}</b> 最大=<b>${g.maxNeighbors}</b><br>` +
    `构建耗时=<b>${g.buildTime.toFixed(1)}</b>ms`;

  // Step 2: 密度·压力
  const s2 = document.getElementById('s2');
  s2.className = 'step' + (stats.activeStep === 2 ? ' active' : '');
  const d = stats.density;
  s2.querySelector('.sline').innerHTML =
    `ρ ∈ [<b>${d.minDensity.toFixed(0)}</b>, <span class="${d.maxDensity > 2000 ? 'warn' : 'good'}"><b>${d.maxDensity.toFixed(0)}</b></span>]<br>` +
    `ρ̄=<b>${d.avgDensity.toFixed(0)}</b>  P ∈ [<b>${d.minPressure.toFixed(0)}</b>, <span class="hot"><b>${d.maxPressure.toFixed(0)}</b></span>]`;

  // Step 3: 力
  const s3 = document.getElementById('s3');
  s3.className = 'step' + (stats.activeStep === 3 ? ' active' : '');
  const f = stats.forces;
  s3.querySelector('.sline').innerHTML =
    `|F压力|<sub>max</sub>=<span class="hot"><b>${f.maxPressureForce.toFixed(0)}</b></span><br>` +
    `|F粘性|<sub>max</sub>=<b>${f.maxViscForce.toFixed(0)}</b><br>` +
    `|F重力|=<b>${f.maxGravityForce.toFixed(0)}</b>`;

  // Step 4: 积分
  const s4 = document.getElementById('s4');
  s4.className = 'step' + (stats.activeStep === 4 ? ' active' : '');
  const it = stats.integrate;
  s4.querySelector('.sline').innerHTML =
    `|a|<sub>max</sub>=<span class="hot"><b>${it.maxAccel.toFixed(0)}</b></span><br>` +
    `|v|<sub>max</sub>=<span class="${it.maxVel > 500 ? 'warn' : 'good'}"><b>${it.maxVel.toFixed(0)}</b></span>  |v|̄=<b>${it.avgVel.toFixed(1)}</b><br>` +
    `dt×sub=<b>${(DT * SUBSTEPS).toFixed(4)}</b>s`;

  // Step 5: 边界
  const s5 = document.getElementById('s5');
  s5.className = 'step' + (stats.activeStep === 5 ? ' active' : '');
  const b = stats.boundary;
  s5.querySelector('.sline').innerHTML =
    `碰撞粒子=<b>${b.collisions}</b><br>` +
    `最大反射速度=<b>${b.maxReflect.toFixed(1)}</b><br>` +
    `damping=<b>${DAMPING}</b>`;
}

function createParticles() {
  // 水 — 球体左半部分
  for (let i = 0; i < 280; i++) {
    const angle = Math.PI * 0.5 + Math.random() * Math.PI;
    const r = Math.random() * BR * 0.6;
    const x = CX + Math.cos(angle) * r * 0.7 - 30;
    const y = CY + Math.sin(angle) * r * 0.7;
    particles.push({
      x, y, vx: 0, vy: 0,
      fx: 0, fy: 0,
      density: 0, pressure: 0,
      type: WATER, mass: 1
    });
  }
  // 蜡 — 球体右半部分
  for (let i = 0; i < 280; i++) {
    const angle = Math.PI * 1.5 + Math.random() * Math.PI;
    const r = Math.random() * BR * 0.6;
    const x = CX + Math.cos(angle) * r * 0.7 + 30;
    const y = CY + Math.sin(angle) * r * 0.7;
    particles.push({
      x, y, vx: 0, vy: 0,
      fx: 0, fy: 0,
      density: 0, pressure: 0,
      type: WAX, mass: 0.6
    });
  }
  setActiveStep(0);
  stats.init.waterCount = 280;
  stats.init.waxCount = 280;
}

// ============ 空间哈希 ============
const GRID_SIZE = H_RADIUS;
let grid = {};
let gridCols = Math.ceil(W / GRID_SIZE);

function hashKey(x, y) {
  const gx = Math.floor(x / GRID_SIZE);
  const gy = Math.floor(y / GRID_SIZE);
  return gx + gy * gridCols;
}

function buildGrid() {
  setActiveStep(1);
  const t0 = performance.now();
  grid = {};
  for (let i = 0; i < particles.length; i++) {
    const key = hashKey(particles[i].x, particles[i].y);
    if (!grid[key]) grid[key] = [];
    grid[key].push(i);
  }
  stats.grid.cellSize = GRID_SIZE;
  stats.grid.cells = Object.keys(grid).length;
  stats.grid.buildTime = performance.now() - t0;
}

function getNeighbors(i) {
  const p = particles[i];
  const gx = Math.floor(p.x / GRID_SIZE);
  const gy = Math.floor(p.y / GRID_SIZE);
  const result = [];
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      const key = (gx + dx) + (gy + dy) * gridCols;
      const cell = grid[key];
      if (cell) {
        for (let j = 0; j < cell.length; j++) {
          if (cell[j] !== i) result.push(cell[j]);
        }
      }
    }
  }
  return result;
}

// ============ SPH 核函数 ============
const H2 = H_RADIUS * H_RADIUS;
const POLY6_COEFF = 315.0 / (64.0 * Math.PI * Math.pow(H_RADIUS, 9));
const SPIKY_COEFF = -45.0 / (Math.PI * Math.pow(H_RADIUS, 6));
const VISC_COEFF = 45.0 / (Math.PI * Math.pow(H_RADIUS, 6));

function poly6(r2) {
  if (r2 >= H2) return 0;
  const diff = H2 - r2;
  return POLY6_COEFF * diff * diff * diff;
}

function spikyGrad(r) {
  if (r >= H_RADIUS || r < 0.001) return 0;
  const diff = H_RADIUS - r;
  return SPIKY_COEFF * diff * diff;
}

function viscLaplacian(r) {
  if (r >= H_RADIUS) return 0;
  return VISC_COEFF * (H_RADIUS - r);
}

// ============ 物理模拟 ============
function computeDensityPressure() {
  setActiveStep(2);
  let minD = Infinity, maxD = 0, sumD = 0, minP = Infinity, maxP = 0;
  let totalN = 0, maxN = 0;
  for (let i = 0; i < particles.length; i++) {
    const pi = particles[i];
    pi.density = 0;
    const neighbors = getNeighbors(i);
    const nCount = neighbors.length;
    totalN += nCount;
    if (nCount > maxN) maxN = nCount;
    for (let n = 0; n < neighbors.length; n++) {
      const j = neighbors[n];
      const pj = particles[j];
      const dx = pj.x - pi.x;
      const dy = pj.y - pi.y;
      const r2 = dx * dx + dy * dy;
      pi.density += pj.mass * poly6(r2);
    }
    // 自身
    pi.density += pi.mass * poly6(0);
    // 密度下限
    if (pi.density < 1) pi.density = 1;
    const props = FLUID_PROPS[pi.type];
    pi.pressure = props.stiffness * (pi.density - props.restDensity);
    // 统计
    if (pi.density < minD) minD = pi.density;
    if (pi.density > maxD) maxD = pi.density;
    sumD += pi.density;
    if (pi.pressure < minP) minP = pi.pressure;
    if (pi.pressure > maxP) maxP = pi.pressure;
  }
  stats.grid.avgNeighbors = (totalN / particles.length).toFixed(1);
  stats.grid.maxNeighbors = maxN;
  stats.density.minDensity = minD;
  stats.density.maxDensity = maxD;
  stats.density.avgDensity = sumD / particles.length;
  stats.density.minPressure = minP;
  stats.density.maxPressure = maxP;
}

function computeForces() {
  setActiveStep(3);
  let maxPF = 0, maxVF = 0, maxGF = 0;
  for (let i = 0; i < particles.length; i++) {
    const pi = particles[i];
    pi.fx = 0;
    const gravF = GRAVITY * pi.density;
    pi.fy = gravF;
    if (gravF > maxGF) maxGF = gravF;
    const neighbors = getNeighbors(i);
    let pfx = 0, pfy = 0, vfx = 0, vfy = 0;
    for (let n = 0; n < neighbors.length; n++) {
      const j = neighbors[n];
      const pj = particles[j];
      const dx = pj.x - pi.x;
      const dy = pj.y - pi.y;
      const r2 = dx * dx + dy * dy;
      if (r2 >= H2 || r2 < 0.0001) continue;
      const r = Math.sqrt(r2);
      // 压力力
      const pressureTerm = -(pi.mass) * (pi.pressure + pj.pressure) / (2 * pj.density);
      const grad = spikyGrad(r);
      const rx = dx / r;
      const ry = dy / r;
      pfx += pressureTerm * grad * rx;
      pfy += pressureTerm * grad * ry;
      // 粘性力 — 取两种流体中较大的粘度
      const mu = Math.max(FLUID_PROPS[pi.type].viscosity, FLUID_PROPS[pj.type].viscosity);
      const visc = mu * pj.mass * viscLaplacian(r) / pj.density;
      vfx += visc * (pj.vx - pi.vx);
      vfy += visc * (pj.vy - pi.vy);
    }
    pi.fx += pfx + vfx;
    pi.fy += pfy + vfy;
    const pForce = Math.sqrt(pfx * pfx + pfy * pfy);
    const vForce = Math.sqrt(vfx * vfx + vfy * vfy);
    if (pForce > maxPF) maxPF = pForce;
    if (vForce > maxVF) maxVF = vForce;
  }
  stats.forces.maxPressureForce = maxPF;
  stats.forces.maxViscForce = maxVF;
  stats.forces.maxGravityForce = maxGF;
}

function integrate(dt) {
  setActiveStep(4);
  let maxA = 0, maxV = 0, sumV = 0;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    // 加速度 a = F / ρ
    const ax = p.fx / p.density;
    const ay = p.fy / p.density;
    const accel = Math.sqrt(ax * ax + ay * ay);
    if (accel > maxA) maxA = accel;
    p.vx += ax * dt;
    p.vy += ay * dt;
    // 速度阻尼
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (speed > maxV) maxV = speed;
    sumV += speed;
    if (speed > 800) {
      p.vx = p.vx / speed * 800;
      p.vy = p.vy / speed * 800;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  stats.integrate.maxAccel = maxA;
  stats.integrate.maxVel = maxV;
  stats.integrate.avgVel = sumV / particles.length;
}

// ============ 边界：密封球体 ============
// 粒子被约束在完整圆内，360° 反射
function enforceBoundary() {
  setActiveStep(5);
  let collisions = 0, maxReflect = 0;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const dx = p.x - CX;
    const dy = p.y - CY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // 超出球体边界则反射回内壁
    if (dist > BR - PARTICLE_R) {
      collisions++;
      const nx = dx / Math.max(dist, 0.001);
      const ny = dy / Math.max(dist, 0.001);
      p.x = CX + nx * (BR - PARTICLE_R);
      p.y = CY + ny * (BR - PARTICLE_R);
      // 反射速度：沿法线反弹
      const vn = p.vx * nx + p.vy * ny;
      if (vn > 0) {
        const reflectSpeed = Math.abs(vn);
        if (reflectSpeed > maxReflect) maxReflect = reflectSpeed;
        p.vx -= (1 + DAMPING) * vn * nx;
        p.vy -= (1 + DAMPING) * vn * ny;
      }
    }
  }
  stats.boundary.collisions = collisions;
  stats.boundary.maxReflect = maxReflect;
}

// ============ 鼠标交互 ============
let mouseX = 0, mouseY = 0, mouseDown = false;
let prevMouseX = 0, prevMouseY = 0;

canvas.addEventListener('mousedown', (e) => {
  mouseDown = true;
  const rect = canvas.getBoundingClientRect();
  prevMouseX = mouseX = (e.clientX - rect.left) * (W / rect.width);
  prevMouseY = mouseY = (e.clientY - rect.top) * (H / rect.height);
});
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  prevMouseX = mouseX;
  prevMouseY = mouseY;
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseY = (e.clientY - rect.top) * (H / rect.height);
});
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mouseleave', () => { mouseDown = false; });

// 触摸支持
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouseDown = true;
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  prevMouseX = mouseX = (t.clientX - rect.left) * (W / rect.width);
  prevMouseY = mouseY = (t.clientY - rect.top) * (H / rect.height);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  prevMouseX = mouseX;
  prevMouseY = mouseY;
  mouseX = (t.clientX - rect.left) * (W / rect.width);
  mouseY = (t.clientY - rect.top) * (H / rect.height);
}, { passive: false });
canvas.addEventListener('touchend', () => { mouseDown = false; });

function applyMouseForce() {
  if (!mouseDown) return;
  const mdx = mouseX - prevMouseX;
  const mdy = mouseY - prevMouseY;
  const mSpeed = Math.sqrt(mdx * mdx + mdy * mdy);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const dx = p.x - mouseX;
    const dy = p.y - mouseY;
    const dist2 = dx * dx + dy * dy;
    if (dist2 > MOUSE_RADIUS * MOUSE_RADIUS) continue;
    if (dist2 < 1) continue;
    const dist = Math.sqrt(dist2);
    const falloff = 1 - dist / MOUSE_RADIUS; // 0~1, 越近越强
    const invDensity = 1 / Math.max(p.density, 1);

    // 1) 拖拽力：沿鼠标运动方向推动粒子
    if (mSpeed > 0.5) {
      const dragFactor = falloff * MOUSE_FORCE * invDensity * DT;
      p.vx += mdx * dragFactor;
      p.vy += mdy * dragFactor;
    }

    // 2) 旋涡力：鼠标按住时产生旋转推力
    //    垂直于径向方向，形成搅拌旋涡
    const nx = dx / dist;
    const ny = dy / dist;
    // 顺时针切线方向 (-ny, nx)
    const vortexStrength = falloff * 6000 * invDensity * DT;
    p.vx += -ny * vortexStrength;
    p.vy +=  nx * vortexStrength;

    // 3) 径向推力：向外推开粒子，形成搅动空洞
    const pushStrength = falloff * falloff * 3000 * invDensity * DT;
    p.vx += nx * pushStrength;
    p.vy += ny * pushStrength;
  }
}

// ============ 渲染 ============
function drawBowl() {
  ctx.save();
  // 球体壁 — 完整圆形
  ctx.beginPath();
  ctx.arc(CX, CY, BR, 0, Math.PI * 2, false);
  ctx.strokeStyle = 'rgba(150, 180, 220, 0.6)';
  ctx.lineWidth = 4;
  ctx.stroke();

  // 球壁内发光
  ctx.beginPath();
  ctx.arc(CX, CY, BR - 2, 0, Math.PI * 2, false);
  ctx.strokeStyle = 'rgba(100, 150, 255, 0.12)';
  ctx.lineWidth = 8;
  ctx.stroke();

  // 球体玻璃高光
  ctx.beginPath();
  ctx.arc(CX - BR * 0.25, CY - BR * 0.25, BR * 0.15, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(200, 220, 255, 0.06)';
  ctx.fill();

  ctx.restore();
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const c = FLUID_PROPS[p.type].color;
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    const brightness = Math.min(1, 0.6 + speed / 400);

    // 搅拌染色：被鼠标搅动的粒子混入金色高光
    let r = c[0] * brightness;
    let g = c[1] * brightness;
    let b = c[2] * brightness;
    let alpha = 0.85;

    if (mouseDown) {
      const dx = p.x - mouseX;
      const dy = p.y - mouseY;
      const dist2 = dx * dx + dy * dy;
      const mr2 = MOUSE_RADIUS * MOUSE_RADIUS;
      if (dist2 < mr2) {
        const blend = (1 - Math.sqrt(dist2) / MOUSE_RADIUS); // 0~1
        const stir = Math.min(1, blend * 1.5); // 搅拌强度
        const speedBoost = Math.min(1, speed / 200); // 速度越快越亮
        const mix = stir * 0.6 + speedBoost * 0.4; // 综合
        // 向金色 (255, 220, 80) 混合
        r = r + (255 - r) * mix * 0.5;
        g = g + (220 - g) * mix * 0.4;
        b = b * (1 - mix * 0.6); // 压暗蓝色通道，偏暖
        alpha = 0.85 + mix * 0.15;
      }
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, RENDER_R, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r | 0}, ${g | 0}, ${b | 0}, ${alpha.toFixed(2)})`;
    ctx.fill();

    // 高速粒子发光拖尾
    if (speed > 150) {
      const glowAlpha = Math.min(0.35, (speed - 150) / 800);
      ctx.beginPath();
      ctx.arc(p.x, p.y, RENDER_R * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 220, 100, ${glowAlpha.toFixed(2)})`;
      ctx.fill();
    }
  }
}

// ============ 主循环 ============
let lastTime = 0;
let fpsArr = [];

function step() {
  buildGrid();
  computeDensityPressure();
  computeForces();
  applyMouseForce();
  for (let s = 0; s < SUBSTEPS; s++) {
    integrate(DT);
    enforceBoundary();
  }
}

let frameCount = 0;
function render(timestamp) {
  // FPS 计算
  if (lastTime) {
    const dt = timestamp - lastTime;
    fpsArr.push(1000 / dt);
    if (fpsArr.length > 30) fpsArr.shift();
  }
  lastTime = timestamp;

  // 物理步进
  step();

  // 绘制
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, W, H);

  drawBowl();
  drawParticles();

  // FPS 显示
  const avgFps = fpsArr.length ? (fpsArr.reduce((a, b) => a + b) / fpsArr.length) : 0;
  ctx.fillStyle = '#666';
  ctx.font = '12px monospace';
  ctx.fillText(`FPS: ${avgFps.toFixed(0)} | Particles: ${particles.length}`, 10, H - 10);

  // 鼠标指示
  if (mouseDown) {
    // 旋涡圈
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, MOUSE_RADIUS, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 内圈
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, MOUSE_RADIUS * 0.4, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,200,100,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 旋涡弧线
    const t = timestamp * 0.005;
    for (let a = 0; a < 3; a++) {
      const startAngle = t + a * Math.PI * 2 / 3;
      ctx.beginPath();
      ctx.arc(mouseX, mouseY, MOUSE_RADIUS * 0.6, startAngle, startAngle + 0.8);
      ctx.strokeStyle = 'rgba(255,200,100,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // 更新算法面板（每 3 帧更新一次减少开销）
  frameCount++;
  if (frameCount % 3 === 0) {
    updateAlgoPanel();
  }

  requestAnimationFrame(render);
}

// ============ 粒子大小控制面板 ============
const sizeSlider = document.getElementById('sizeSlider');
const sizeVal = document.getElementById('sizeVal');
const panelBody = document.getElementById('panelBody');
const panelIcon = document.getElementById('panelIcon');
let panelOpen = true;

sizeSlider.addEventListener('input', () => {
  const v = parseFloat(sizeSlider.value);
  RENDER_R = v;
  PARTICLE_R = v;
  sizeVal.textContent = v.toFixed(1);
});

document.getElementById('panelToggle').addEventListener('click', () => {
  panelOpen = !panelOpen;
  panelBody.classList.toggle('hidden', !panelOpen);
  panelIcon.textContent = panelOpen ? '−' : '+';
});

// ============ 颜色控制 ============
function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1, 3), 16),
    parseInt(hex.slice(3, 5), 16),
    parseInt(hex.slice(5, 7), 16)
  ];
}

document.getElementById('waterColor').addEventListener('input', (e) => {
  FLUID_PROPS[WATER].color = hexToRgb(e.target.value);
});

document.getElementById('waxColor').addEventListener('input', (e) => {
  FLUID_PROPS[WAX].color = hexToRgb(e.target.value);
});

// ============ 启动 ============
createParticles();
requestAnimationFrame(render);
</script>
